<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>gherkit Begleitfenster</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font:12px system-ui,Segoe UI,sans-serif}
  #bar{height:24px;display:flex;align-items:center;background:#0f1a2b;color:#cfd7e4;padding:0 6px 0 10px;-webkit-app-region:drag}
  #bar span{flex:1}
  #bar button{-webkit-app-region:no-drag;background:transparent;border:0;color:#cfd7e4;width:26px;height:22px;cursor:pointer;font-size:14px}
  #bar button:hover{background:#ffffff22}
  #root{height:calc(100% - 24px)}
</style></head>
<body>
<div id="bar"><span>gherkit · manueller Test</span><button id="min" title="Minimieren">–</button><button id="close" title="Schliessen">×</button></div>
<div id="root"></div>
<script src="common/scenario.js"></script>
<script src="common/xray.js"></script>
<script src="common/panel.js"></script>
<script>
  var store = GherkitPanel.localStore('gk-proto-d4');
  GherkitPanel.mount(document.getElementById('root'), {
    scenarios: GK_SCENARIOS, load: store.load, save: store.save,
    captureEvidence: window.gk ? function () { return window.gk.shot(); } : undefined
  });
  if (window.gk) {
    document.getElementById('min').onclick = function () { window.gk.win('min'); };
    document.getElementById('close').onclick = function () { window.gk.win('close'); };
  }
</script></body></html>
