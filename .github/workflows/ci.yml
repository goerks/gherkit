name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -cover ./internal/...

  windows-binary:
    name: windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build gherkit.exe
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          v="dev-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X github.com/goerks/gherkit/internal/cli.Version=$v -X github.com/goerks/gherkit/internal/cli.Commit=${GITHUB_SHA::7}" -o dist/gherkit.exe ./cmd/gherkit
      - name: Smoke test
        shell: bash
        run: |
          ./dist/gherkit.exe --help
          ./dist/gherkit.exe fmt --check features
          ./dist/gherkit.exe lint --strict features
      - name: gherkit run starts a runner through cmd.exe
        shell: bash
        run: |
          printf '%s' '[{"uri":"f.feature","keyword":"Feature","name":"F","elements":[{"keyword":"Scenario","name":"ok","type":"scenario","steps":[{"keyword":"Given ","name":"a","line":1,"result":{"status":"passed","duration":1}}]},{"keyword":"Scenario","name":"bad","type":"scenario","steps":[{"keyword":"Given ","name":"b","line":2,"result":{"status":"failed","duration":1}}]}]}]' > results.json
          set +e
          ./dist/gherkit.exe run --cmd 'copy results.json {output}' -o "out dir/cucumber.json" --report "out dir/report.html"
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
          test -s "out dir/cucumber.json"
          grep -q "1 / 2" "out dir/report.html"
      - name: Collect download
        shell: bash
        run: |
          cp -r examples dist/examples
          printf '%s\r\n' 'gherkit.exe edit examples' > dist/editor.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: gherkit-windows-amd64
          path: dist/
          retention-days: 14

  dogfood:
    name: acceptance (gherkit tests gherkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Format check of our own specifications
        run: bin/gherkit fmt --check features e2e/features
      - name: Lint our own specifications (annotations on the PR)
        run: bin/gherkit lint --strict -o github features e2e/features
      - name: Run acceptance tests with gherkit run
        run: bin/gherkit run --adapter go --cmd "go test -count=1 ./acceptance -args -gherkit.cucumber={output}" -o build/acceptance/cucumber.json
      - name: Report with gherkit
        if: always()
        run: |
          bin/gherkit report build/acceptance/cucumber.json -o build/acceptance/report.html --title "gherkit acceptance tests"
          bin/gherkit report build/acceptance/cucumber.json -f md --title "gherkit acceptance tests" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: build/acceptance/

  e2e:
    name: browser tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build gherkit
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "bin/gherkit$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/gherkit
      - name: Browser tests of the editor
        shell: bash
        working-directory: e2e
        run: |
          npm install
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
          npm test
        env:
          GHERKIT_SHOTS: ${{ github.workspace }}/build/editor-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots-${{ matrix.os }}
          path: build/editor-shots/
          if-no-files-found: ignore

  java-runner:
    name: java adapter (Maven, Cucumber-JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: runner-examples/java/pom.xml
      - run: make build
      - name: gherkit run with the Java adapter
        run: bin/gherkit run --adapter java --dir runner-examples/java -o build/java/cucumber.json --report build/java/report.html --title "Java example"
      - name: A failing scenario makes gherkit run exit with 1
        shell: bash
        run: |
          set +e
          bin/gherkit run --adapter java --dir runner-examples/java --cmd "mvn -B -ntp test -Dcucumber.filter.tags=@fails" -o build/java/failing.json
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-adapter-report
          path: build/java/

  site:
    name: static site (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the site
        run: scripts/build-site.sh build/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser test of the site (the CLI runs as WebAssembly)
        working-directory: e2e
        env:
          GHERKIT_SITE: ${{ github.workspace }}/build/site
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:demo
      - name: Check the site
        shell: bash
        run: |
          set -e
          test -s build/site/index.html
          test -f build/site/.nojekyll
          for f in gherkit-windows-amd64 gherkit-windows-arm64 gherkit-linux-amd64 gherkit-linux-arm64 gherkit-darwin-amd64 gherkit-darwin-arm64; do
            test -s "build/site/downloads/$f.zip"
            unzip -tq "build/site/downloads/$f.zip"
          done
          unzip -tq build/site/downloads/standard-set.zip
          # every download linked from the page exists
          for l in $(grep -o 'href="downloads/[^"]*"' build/site/index.html | sed 's/href="//; s/"$//'); do
            test -s "build/site/$l" || { echo "missing: $l"; exit 1; }
          done
          # no placeholder is left in the page
          ! grep -q '{{' build/site/index.html
          # the Linux download works
          mkdir -p /tmp/dl && unzip -q build/site/downloads/gherkit-linux-amd64.zip -d /tmp/dl
          /tmp/dl/gherkit --version
          /tmp/dl/gherkit parse /tmp/dl/examples/shop/checkout.feature > /dev/null
          /tmp/dl/gherkit dialects | head -3
          (cd build/site/downloads && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site/
          retention-days: 7

  release-check:
    name: goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: build --snapshot --clean

  verify:
    name: verification summary
    if: always()
    needs: [test, windows-binary, dogfood, e2e, java-runner, release-check, site]
    runs-on: ubuntu-latest
    steps:
      - name: What the pipeline verified
        shell: bash
        env:
          UNIT: ${{ needs.test.result }}
          WINDOWS: ${{ needs.windows-binary.result }}
          ACCEPT: ${{ needs.dogfood.result }}
          BROWSER: ${{ needs.e2e.result }}
          JAVA: ${{ needs.java-runner.result }}
          RELEASE: ${{ needs.release-check.result }}
          SITE: ${{ needs.site.result }}
        run: |
          mark() { if [ "$1" = success ]; then echo "✅ passed"; else echo "❌ $1"; fi; }
          {
            echo "### What this run verified"
            echo
            echo "| Check | What it proves | Result |"
            echo "| --- | --- | --- |"
            echo "| Unit tests (Linux, macOS, Windows) | Parser, formatter (official corpus, CRLF), linter, report, runner adapters, editor API | $(mark "$UNIT") |"
            echo "| Acceptance (gherkit tests gherkit) | Behaviour through the real binary; the suite itself runs through \`gherkit run\` with the Go adapter | $(mark "$ACCEPT") |"
            echo "| Browser tests (Linux, Windows) | Editor in Chromium: automatic indentation, Structure, Split, test cases tab, saving, CRLF | $(mark "$BROWSER") |"
            echo "| Windows binary | gherkit.exe builds, fmt/lint work on a CRLF checkout, \`gherkit run\` starts a runner through cmd.exe | $(mark "$WINDOWS") |"
            echo "| Java adapter | Maven and Cucumber-JVM run through \`gherkit run\`; a failing scenario gives exit code 1 | $(mark "$JAVA") |"
            echo "| Release config | goreleaser builds all platforms | $(mark "$RELEASE") |"
            echo "| Static site | The GitHub Pages site builds, every download is complete, the Linux download runs and the CLI works in the browser (WebAssembly, virtual folder, terminal) | $(mark "$SITE") |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$UNIT" "$WINDOWS" "$ACCEPT" "$BROWSER" "$JAVA" "$RELEASE" "$SITE"; do
            [ "$r" = success ] || exit 1
          done
